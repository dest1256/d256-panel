# d256 panel. The image comes prebuilt from GitHub (ghcr.io); all data lives next to this file:
#   ./db    SQLite database (x-ui.db), logs and the internal CA of the node link -- back this folder up
#   ./cert  TLS certificates, if you want the panel to serve HTTPS itself (optional)
#
# Run:  docker compose up -d        Update:  docker compose pull && docker compose up -d
# The image is built by GitHub Actions on every release and pulled from ghcr.io; nothing is built on the server.
# The web UI (2053) and the subscriptions (2096) are reached through your reverse proxy on the network below,
# e.g. in Caddy:   panel.example.com { reverse_proxy d256-panel:2053 }
#                  panel.example.com:2096 { reverse_proxy d256-panel:2096 }
# Nodes connect to port 8444 directly (gRPC + mTLS), so open it in the firewall.
services:
  init:
    image: alpine:3.22
    restart: "no"
    command: chown -R 10001:10001 /data /app/cert
    volumes:
      - ./db:/data
      - ./cert:/app/cert

  d256-panel:
    # A prebuilt image from GitHub Actions: nothing is compiled on your server.
    # Pin a version with D256_PANEL_TAG=v1.1.0 in .env; the default follows the latest release.
    image: ghcr.io/dest1256/d256-panel:${D256_PANEL_TAG:-latest}
    pull_policy: always
    container_name: d256-panel
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "8444:8444"
    volumes:
      - ./db:/data
      - ./cert:/app/cert
    environment:
      TZ: ${TZ:-UTC}
      XUI_CONN_RETENTION_DAYS: ${XUI_CONN_RETENTION_DAYS:-30}
      XUI_CONN_DAILY_RETENTION_DAYS: ${XUI_CONN_DAILY_RETENTION_DAYS:-365}
      XUI_TRAFFIC_RETENTION_DAYS: ${XUI_TRAFFIC_RETENTION_DAYS:-90}
      # Where the panel looks for new node releases (change it if you run your own fork).
      XUI_NODE_RELEASE_REPO: ${XUI_NODE_RELEASE_REPO:-dest1256/d256-node}
    networks:
      - caddy-net

networks:
  caddy-net:
    external: true
    name: ${PROXY_NETWORK:-Caddy-net}
