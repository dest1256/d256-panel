name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dev container
        run: docker build -t d256-panel-dev .devcontainer
      - name: Proto is up to date
        run: ./dev make proto && git diff --exit-code -- proto
      - name: Lint, test, build
        run: ./dev make verify
  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image (not pushed)
        run: docker build -t d256-panel:ci .
